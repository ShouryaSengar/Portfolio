<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E6E9E3" />

    <!-- Preload the display face only. It renders the LCP text, so it must not
         wait on CSS discovery. Plex Mono is below-the-fold detail and is left to
         normal discovery. -->
    <link
      rel="preload"
      href="/fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      PLACEHOLDER METADATA — Phase 0 scaffold only.
      Real title, description, and OG tags land in Phase 5 once the copy exists.
      Do not ship this as-is.
    -->
    <title>Shourya Singh Sengar — Software Engineer</title>
    <meta
      name="description"
      content="Software Engineer specialising in React and React Native, building server-driven UI for enterprise insurance and fintech."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!--
        No contact address here, deliberately. This is static markup, which is
        precisely what bulk address harvesters read — putting the email in this
        fallback would defeat the client-side assembly in shared/lib/contact
        entirely. Profile URLs are safe: they are already public pages, not
        harvestable addresses.
      -->
      This site needs JavaScript to run. Shourya Singh Sengar — Software Engineer,
      React and React Native. Reach him via
      <a href="https://www.linkedin.com/in/shourya-singh-sengar-57921b146">LinkedIn</a>
      or <a href="https://github.com/ShouryaSengar">GitHub</a>.
    </noscript>
  </body>
</html>
