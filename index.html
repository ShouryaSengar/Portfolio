<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E6E9E3" />

    <!-- Primary meta -->
    <title>Shourya Singh Sengar — Software Engineer, React &amp; React Native</title>
    <meta
      name="description"
      content="Software Engineer building server-driven UI and schema-driven platforms for enterprise insurance and fintech. React, React Native, TypeScript. 2+ years, 100,000+ DAU across 3 production apps."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-shourya-sengar.vercel.app/" />
    <meta
      property="og:title"
      content="Shourya Singh Sengar — Software Engineer"
    />
    <meta
      property="og:description"
      content="Server-driven UI and schema-driven platforms for enterprise insurance and fintech. React, React Native, TypeScript."
    />
    <!-- og:image deferred until Phase 7 produces the OG image asset. Omitting it is
         valid — link previews still work from the title and description. -->
    <meta
      property="og:image"
      content="https://portfolio-shourya-sengar.vercel.app/og-image.svg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shourya Singh Sengar — Software Engineer"
    />
    <meta
      name="twitter:description"
      content="Server-driven UI and schema-driven platforms for enterprise insurance and fintech."
    />
    <meta
      name="twitter:image"
      content="https://portfolio-shourya-sengar.vercel.app/og-image.svg"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://portfolio-shourya-sengar.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload the display face — it renders the LCP text, so it must not wait on
         CSS discovery. Plex Mono is below-the-fold detail and left to normal load. -->
    <link
      rel="preload"
      href="/fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!--
        No contact address here. This is static markup, which is precisely what bulk
        address harvesters read — putting the email in this fallback would defeat the
        client-side assembly in shared/lib/contact entirely.
      -->
      This site needs JavaScript to run. Shourya Singh Sengar — Software Engineer,
      React and React Native. Reach him via
      <a href="https://www.linkedin.com/in/shourya-singh-sengar-57921b146">LinkedIn</a>
      or <a href="https://github.com/ShouryaSengar">GitHub</a>.
    </noscript>
  </body>
</html>
