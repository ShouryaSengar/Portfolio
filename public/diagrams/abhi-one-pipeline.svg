<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <!-- Background -->
  <rect width="960" height="540" fill="#FAF9F7"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#8B8B8B">ABHI ONE — SCHEMA-DRIVEN FORM PLATFORM</text>

  <!-- Flow: API Metadata → Schema Parser → Form Renderer → Validation → Submission -->

  <!-- Node 1: API Metadata -->
  <rect x="40" y="180" width="160" height="80" rx="4" stroke="#C8D5D3" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="120" y="212" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8B8B8B">SOURCE</text>
  <text x="120" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">API Metadata</text>
  <text x="120" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B6B6B">Policy definitions</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="220" x2="260" y2="220" stroke="#2A7C6B" stroke-width="1.5"/>
  <polygon points="260,216 268,220 260,224" fill="#2A7C6B"/>
  <text x="230" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#2A7C6B">parse</text>

  <!-- Node 2: Schema Parser -->
  <rect x="270" y="180" width="160" height="80" rx="4" stroke="#C8D5D3" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="350" y="212" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8B8B8B">TRANSFORM</text>
  <text x="350" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Schema Parser</text>
  <text x="350" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B6B6B">Fields, rules, logic</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="220" x2="490" y2="220" stroke="#2A7C6B" stroke-width="1.5"/>
  <polygon points="490,216 498,220 490,224" fill="#2A7C6B"/>
  <text x="460" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#2A7C6B">render</text>

  <!-- Node 3: Form Renderer -->
  <rect x="500" y="180" width="160" height="80" rx="4" stroke="#2A7C6B" stroke-width="1.5" fill="#F0F7F5"/>
  <text x="580" y="212" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#2A7C6B">CORE</text>
  <text x="580" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Form Renderer</text>
  <text x="580" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B6B6B">15+ policy workflows</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="220" x2="720" y2="220" stroke="#2A7C6B" stroke-width="1.5"/>
  <polygon points="720,216 728,220 720,224" fill="#2A7C6B"/>
  <text x="690" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#2A7C6B">validate</text>

  <!-- Node 4: Validation -->
  <rect x="730" y="180" width="160" height="80" rx="4" stroke="#C8D5D3" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="810" y="212" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8B8B8B">GUARD</text>
  <text x="810" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Validation</text>
  <text x="810" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B6B6B">Conditional rules</text>

  <!-- Second row: Chat assistance -->
  <rect x="270" y="340" width="200" height="70" rx="4" stroke="#C8D5D3" stroke-width="1.5" fill="#FFFFFF"/>
  <text x="370" y="368" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8B8B8B">SUPPORT</text>
  <text x="370" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">In-app Chat</text>
  <text x="370" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B6B6B">FAQ + guided flows</text>

  <!-- Arrow from chat to form -->
  <line x1="470" y1="375" x2="545" y2="268" stroke="#C8D5D3" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="520" y="310" font-family="monospace" font-size="9" fill="#8B8B8B">assists</text>

  <!-- Scaling callout -->
  <rect x="540" y="340" width="340" height="70" rx="4" stroke="#C8D5D3" stroke-width="1" stroke-dasharray="4 3" fill="#FFFFFF"/>
  <text x="560" y="365" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#2A7C6B">SCALING MODEL</text>
  <text x="560" y="385" font-family="system-ui, sans-serif" font-size="12" fill="#1A1A1A">New policy = metadata change, not a release.</text>
  <text x="560" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#6B6B6B">Form layer stops being the bottleneck.</text>

  <!-- Bottom metrics -->
  <line x1="40" y1="470" x2="920" y2="470" stroke="#C8D5D3" stroke-width="1"/>
  <text x="160" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#2A7C6B">70%</text>
  <text x="160" y="520" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B8B8B">LESS FORM DEV EFFORT</text>
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#2A7C6B">15+</text>
  <text x="400" y="520" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B8B8B">POLICY WORKFLOWS</text>
  <text x="640" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#2A7C6B">500+</text>
  <text x="640" y="520" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B8B8B">QUERIES AUTOMATED/WEEK</text>
  <text x="840" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#2A7C6B">35%</text>
  <text x="840" y="520" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B8B8B">FEWER SUPPORT TICKETS</text>
</svg>
